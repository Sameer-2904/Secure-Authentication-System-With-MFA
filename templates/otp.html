<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFA Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .auth-icon {
            text-align: center;
            font-size: 40px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 5px;
            font-weight: bold;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        input[type="text"]::placeholder {
            letter-spacing: normal;
            font-weight: normal;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            margin: 20px 0 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-verify {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-verify:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-verify:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        
        .timer {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 15px;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="auth-icon">📱</div>
    <h1>Two-Factor Authentication</h1>
    <p class="subtitle">Enter the 6-digit code from your authenticator app</p>
    
    <div id="message" class="message"></div>
    
    <div class="form-group">
        <label for="otp">Verification Code</label>
        <input type="text" id="otp" placeholder="000000" maxlength="6" inputmode="numeric" required>
    </div>
    
    <button class="btn btn-verify" onclick="verify()">Verify</button>
    
    <div class="timer">
        <p>✓ Code refreshes every 30 seconds</p>
    </div>
    
    <div class="back-link">
        <a href="/" onclick="event.preventDefault(); goBack()">← Back to Login</a>
    </div>
</div>

<script>
    function showMessage(text, type) {
        const msgEl = document.getElementById('message');
        msgEl.textContent = text;
        msgEl.className = 'message ' + type;
        msgEl.style.display = 'block';
    }
    
    async function verify() {
        const otp = document.getElementById('otp').value.trim();
        
        if (!otp) {
            showMessage('OTP code is required', 'error');
            return;
        }
        
        if (!/^\d{6}$/.test(otp)) {
            showMessage('OTP must be exactly 6 digits', 'error');
            return;
        }
        
        const btn = event.target;
        btn.disabled = true;
        btn.textContent = 'Verifying...';
        
        try {
            const response = await fetch('/api/verify-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    otp: otp
                })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                showMessage('✓ Login successful! Redirecting...', 'success');
                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('username', data.username);
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1500);
            } else {
                showMessage(data.message || 'Verification failed', 'error');
                btn.disabled = false;
                btn.textContent = 'Verify';
                document.getElementById('otp').value = '';
                document.getElementById('otp').focus();
            }
        } catch (error) {
            showMessage('Connection error: ' + error.message, 'error');
            btn.disabled = false;
            btn.textContent = 'Verify';
        }
    }
    
    function goBack() {
        if (confirm('Are you sure you want to go back? You will need to login again.')) {
            window.location.href = '/';
        }
    }
    
    // Allow Enter key and auto-submit when 6 digits entered
    document.getElementById('otp').addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            verify.call(event.target);
        }
    });
    
    // Auto-submit when 6 digits are entered
    document.getElementById('otp').addEventListener('input', function() {
        if (this.value.length === 6 && /^\d{6}$/.test(this.value)) {
            verify.call(this);
        }
    });
    
    // Focus on input field
    document.getElementById('otp').focus();
</script>

</body>
</html>
